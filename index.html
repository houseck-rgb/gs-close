<html lang="ko">
<head>

<script>
/* 카톡·네이버·라인·인스타 등 앱 안에서 링크를 누르면 → 자동으로 크롬/사파리(다른 브라우저)로 열기 */
(function(){var u=navigator.userAgent,h=location.href,A=/Android/i.test(u),I=/iPhone|iPad|iPod/i.test(u);
var inApp=/KAKAOTALK|NAVER|Line\/|Instagram|FBAN|FBAV|DaumApps|Whale\/.*Mobile.*inapp|everytimeApp|BAND\/|; wv\)/i.test(u);
if(!inApp||sessionStorage.getItem('xb'))return;sessionStorage.setItem('xb',1);
if(/KAKAOTALK/i.test(u)){location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(h);return}
if(/Line\//i.test(u)){location.href=h+(h.indexOf('?')<0?'?':'&')+'openExternalBrowser=1';return}
if(A){location.href='intent://'+h.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(h)+';end';return}
if(I)window.__iosInApp=1;})();
</script>
<style>
:root{--g:#34c759;--gl:#fff;--ink:#1c1c1e;--sub:#8e8e93;--line:rgba(60,60,67,.12);--red:#ff3b30;--bl:#007aff;--bg:#f2f2f7;--hl:#007aff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Malgun Gothic",Roboto,sans-serif}
body{padding:0 0 calc(110px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:rgba(242,242,247,.85);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);color:var(--ink);padding:calc(14px + env(safe-area-inset-top)) 20px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:28px;letter-spacing:-.5px;margin:0;flex:1}
header .d{font-size:15px;color:var(--sub);font-weight:600}
#bar{height:4px;margin:0 20px;border-radius:2px;overflow:hidden;background:#e5e5ea}#bar i{display:block;height:100%;width:0;background:var(--hl);transition:width .3s}
#xb{display:none;background:#fff3c4;color:#5a3d00;padding:12px 14px;font-size:15px;font-weight:700;line-height:1.45;text-align:center}
#xb button{margin-top:8px;border:0;border-radius:10px;background:#191919;color:#fff;font-size:15px;font-weight:800;padding:10px 16px}
main{padding:14px 16px;max-width:640px;margin:0 auto}
.card{background:#fff;border:0;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04);content-visibility:auto;contain-intrinsic-size:auto 330px}
.card.done{opacity:.72}
.card.hl{box-shadow:0 0 0 2px var(--bl)}
.card.hl .chk{border-width:3px}
.hd{display:flex;align-items:flex-start;gap:10px}
.no{flex:none;width:30px;height:30px;border-radius:50%;background:#e5e5ea;color:#3a3a3c;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:16px}
.done .no{background:var(--g);color:#fff}
.tt{flex:1;font-size:19px;font-weight:700;letter-spacing:-.3px;line-height:1.35}
.tm{display:inline-block;background:#fff4e5;color:#c76a00;font-size:14px;font-weight:800;border-radius:6px;padding:1px 7px;margin-right:4px;vertical-align:2px}
.ds{font-size:15px;color:var(--sub);margin:6px 0 0 40px;line-height:1.45}
.ds b{color:var(--red);font-size:18px;letter-spacing:1px;font-weight:600}
.ds ol{margin:4px 0 0;padding-left:20px}.ds li{margin:2px 0}.ds li b{font-size:inherit;letter-spacing:0}
.gd{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.gd button{position:relative;border:0;padding:0;border-radius:8px;overflow:hidden;aspect-ratio:3/4;background:#eee;cursor:zoom-in}
.gd img{width:100%;height:100%;object-fit:cover;display:block}
.gd span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);color:#fff;font-size:12px;font-weight:800;padding:4px 2px;text-align:center}
.ph{display:grid;gap:8px;margin-top:12px}.ph.n1{grid-template-columns:1fr}.ph.n2{grid-template-columns:1fr 1fr}.ph.n3{grid-template-columns:1fr 1fr 1fr}.ph.n1 .slot{aspect-ratio:16/10}.ph.sm{grid-template-columns:1fr 1fr}.ph.sm .slot{aspect-ratio:1}.ph.xs{grid-template-columns:36%}.ph.n3 .lb{font-size:13px;padding:7px 2px}.ph.n3 .ex{font-size:11px}
.slot{position:relative;border-radius:12px;overflow:hidden;background:#f2f2f7;aspect-ratio:3/4;border:0;padding:0;font:inherit;cursor:pointer}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot .lb{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;font-size:15px;font-weight:600;padding:8px 4px;text-align:center}
.slot .ex{position:absolute;top:6px;left:6px;background:rgba(255,255,255,.9);color:#3a3a3c;font-size:12px;font-weight:600;border-radius:8px;padding:2px 6px}
.slot.ok .lb{background:rgba(52,199,89,.85)}
.slot.ok .ex{background:var(--g);color:#fff}
.slot .ic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:56px;padding-bottom:30px}
.chk{margin-top:12px;width:100%;min-height:52px;border:0;background:rgba(0,122,255,.1);color:var(--bl);border-radius:14px;font-size:17px;font-weight:600;cursor:pointer}
.done .chk{background:rgba(52,199,89,.12);color:#248a3d}
.foot{position:fixed;left:0;right:0;bottom:0;background:rgba(242,242,247,.85);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:5}
.foot .in{max-width:640px;margin:0 auto;display:flex;gap:8px}
#share{flex:1;min-height:58px;border:0;border-radius:14px;background:#FEE500;color:#191919;font-size:18px;font-weight:700;cursor:pointer}
#share:disabled{background:#eee;color:#999}
#reset{flex:none;width:72px;line-height:1.3;font-weight:600;border:0;background:#fff;border-radius:14px;font-size:14px;color:var(--red)}
#msg{text-align:center;font-size:14px;color:var(--sub);margin-bottom:6px}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:9;color:#fff;font-size:18px;font-weight:700}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:10;flex-direction:column;gap:10px;padding:16px}
#zoom img{max-width:100%;max-height:80vh;border-radius:10px}#zoom p{color:#fff;font-size:18px;font-weight:800;margin:0}
input[type=file]{display:none}
#next{flex:1;min-height:58px;border:0;border-radius:14px;background:var(--bl);color:#fff;font-size:18px;font-weight:600;cursor:pointer;line-height:1.2}
#next small{display:block;font-size:13px;font-weight:400;opacity:.85}
.slot.nx{outline:3px solid var(--hl);outline-offset:-4px}
.chk.nx{background:var(--bl);color:#fff}
</style>
</head>
<body>
<header><h1>🔒 가산 마감 보고</h1><span class="d" id="today"></span></header>
<div id="xb">아이폰은 앱 안에서 사진 보내기가 안 될 수 있어요.<br>오른쪽 아래(또는 위) <u>⋯ / 공유 → Safari로 열기</u>를 눌러주세요.<br><button id="cp">🔗 주소 복사하기</button></div>
<div id="bar"><i></i></div>
<main id="list"></main>
<div class="foot"><div id="msg"></div><div class="in"><button id="reset">다시/<br>지우기</button><button id="next"></button><button id="share" disabled style="display:none">📤 앱 공유로 한 번에 보고</button></div></div>
<div id="busy">저장 중…</div>
<div id="zoom"><img alt=""><p></p></div>
<input type="file" id="cam" accept="image/*" capture="environment">
<script>
var STEPS=[
{id:'phone',sm:2,tm:'8:00',t:'무선 전화기 충전',d:'사용 후 거치대에 꽂고 <b style="font-size:inherit;letter-spacing:0">초록 불</b> 들어온 것 찍기',ph:[['phone','거치대 충전']]},
{id:'power',tm:'8:10',t:'전기 빼기',d:'예시 사진 3곳 플러그를 모두 뺀 뒤 각각 찍기',ph:[['p1','1번 멀티탭'],['p2','2번 멀티탭'],['p3','3번 콘센트']]},
{id:'sauce',t:'고추다데기 · 와사비 새로 채우기',d:'남은 것은 걷어내고 <b style="font-size:inherit;letter-spacing:0">새로 채운 모습</b>을 한 장에 찍기<br>🧽 용기 관리(세척)는 <b style="font-size:inherit;letter-spacing:0">1주일에 1번</b>',ph:[['sauce','고추다데기 · 와사비']]},
{id:'ac',t:'에어컨 2대 끄기',d:'2대 모두 꺼진 화면 찍기',ph:[['a1','에어컨 1'],['a2','에어컨 2']]},
{id:'kitchen',hl:1,tm:'9:10',t:'주방 마감 전달 · OFF',d:'주방에 마감 전달하고 OFF 했으면 완료 버튼',ph:[]},
{id:'pos',t:'이동식 포스 3대 OFF',d:'3대 화면이 모두 꺼진 상태로 한 장',ph:[['pos','포스 3대']]},
{id:'main',t:'메인 포스 마감 · 매출 출력',d:'<ol><li>메인 포스 <b>[부가기능]</b></li><li><b>[마감정산]</b> → 매장 태블릿 전체 마감</li><li><b>[내일 날짜 개점]</b> 누르기</li><li>“모든 장비 정산지 출력?” → <b>[아니오]</b></li><li>메인 포스 <b>매출 영수증 출력</b> → 메인 포스 마감</li></ol>사진을 누르면 크게 보여요',
 sm:1,gd:[['g1','① 부가기능'],['g2','② 마감정산'],['g3','③ 내일 개점'],['g4','④ 아니오']],ph:[['rcpt','매출 영수증']]},
{id:'back',t:'뒷문 잠금',d:'잠금장치가 걸린 모습 찍기',ph:[['back','뒷문 잠금']]},
{id:'light',t:'매장 조명 모두 끄기',d:'스위치가 모두 꺼진 상태 찍기',ph:[['light','조명 스위치']]},
{id:'lock',t:'매장 문 잠금 🔐',d:'도어락 <b>#5324#</b> 잠금 → <b style="font-size:inherit;letter-spacing:0">도어락 버튼을 한 번 눌러 잠김 재확인</b><br>📷 <b style="font-size:inherit;letter-spacing:0">유리문 안쪽 매장 불이 꺼진 게 보이게</b> 도어락과 함께 찍기',ph:[['lock','문 잠금 · 불 꺼짐']],cf:'🔐 도어락 버튼 눌러 재확인 완료'}
];
var S={date:'',items:{}},photos={},urls={},db,cur=null,EX={};
var $=function(s){return document.querySelector(s)};
function today(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function p2(n){return(n<10?'0':'')+n}
function hm(t){var d=new Date(t);return p2(d.getHours())+':'+p2(d.getMinutes())}
function save(){try{localStorage.setItem('gasanClose',JSON.stringify(S))}catch(e){}}
function idb(cb){try{var r=indexedDB.open('gasanClose',1);r.onupgradeneeded=function(){r.result.createObjectStore('p')};r.onsuccess=function(){db=r.result;cb()};r.onerror=function(){cb()}}catch(e){cb()}}
function tx(m){return db.transaction('p',m).objectStore('p')}
function putP(k,b){photos[k]=b;if(db)try{tx('readwrite').put(b,k)}catch(e){}}
function clearP(){photos={};for(var k in urls)URL.revokeObjectURL(urls[k]);urls={};if(db)try{tx('readwrite').clear()}catch(e){}}
function loadP(cb){if(!db)return cb();var st=tx('readonly'),r=st.openCursor();r.onsuccess=function(){var c=r.result;if(c){photos[c.key]=c.value;c.continue()}else cb()};r.onerror=function(){cb()}}

function stepDone(s){var it=S.items[s.id]||{};if(s.ph.length&&!s.ph.every(function(p){return it[p[0]]}))return false;return s.ph.length&&!s.cf?true:!!it.ok}
function nextStep(){for(var i=0;i<STEPS.length;i++){var s=STEPS[i],it=S.items[s.id]||{};
if(s.ph.length){for(var j=0;j<s.ph.length;j++)if(!it[s.ph[j][0]])return{s:s.id,p:s.ph[j][0],lab:'📷 '+s.ph[j][1]+' 찍기',sub:(i+1)+'. '+s.t+(s.ph.length>1?' ('+(j+1)+'/'+s.ph.length+')':'')}}
if((!s.ph.length||s.cf)&&!it.ok)return s.cf?{c:s.id,lab:s.cf,sub:'도어락 버튼 한 번 눌러 잠긴 것 확인 후 누르기'}:{c:s.id,lab:'✅ '+(i+1)+'. '+s.t+' 완료',sub:'완료했으면 누르기'}}return null}
/* 예시 사진은 화면에 보일 때만 넣음 → 느린 폰도 빨리 켜짐 */
var io=('IntersectionObserver'in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var im=e.target;if(EX[im.dataset.k]){im.src=EX[im.dataset.k];io.unobserve(im)}}})},{rootMargin:'300px'}):null;
function exImg(k){return'<img data-k="'+k+'" decoding="async" alt="">'}
function fillEx(){[].forEach.call(document.querySelectorAll('img[data-k]'),function(im){if(im.src)return;if(io){io.unobserve(im);io.observe(im)}else if(EX[im.dataset.k])im.src=EX[im.dataset.k]})}
function render(){
var h='',n=0,N=nextStep();
STEPS.forEach(function(s,i){var it=S.items[s.id]||{},dn=stepDone(s);if(dn)n++;
h+='<section id="c_'+s.id+'" class="card'+(dn?' done':'')+(s.hl?' hl':'')+'"><div class="hd"><div class="no">'+(dn?'✓':i+1)+'</div><div class="tt">'+(s.tm?'<span class="tm">'+s.tm+'</span>':'')+s.t+'</div></div><div class="ds">'+s.d+'</div>';
if(s.gd){h+='<div class="gd">';s.gd.forEach(function(g){h+='<button data-z="'+g[0]+'" data-zl="'+g[1]+'">'+exImg(g[0])+'<span>'+g[1]+'</span></button>'});h+='</div>'}
if(s.ph.length){h+='<div class="ph n'+s.ph.length+(s.sm?(s.sm>1?' sm xs':' sm'):'')+'">';s.ph.forEach(function(p){var k=s.id+'_'+p[0],has=it[p[0]]&&photos[k];
if(has&&!urls[k])urls[k]=URL.createObjectURL(photos[k]);
h+='<button class="slot'+(has?' ok':'')+(N&&N.s===s.id&&N.p===p[0]?' nx':'')+'" data-s="'+s.id+'" data-p="'+p[0]+'">'+(has?'<img decoding="async" src="'+urls[k]+'" alt="">':exImg(p[0]))+'<span class="ex">'+(has?'✓ '+hm(it[p[0]]):'예시')+'</span><span class="lb">'+(has?'다시 찍기':'📷 '+p[1])+'</span></button>'});h+='</div>'}
if(s.cf)h+='<button class="chk'+(N&&N.c===s.id?' nx':'')+'" data-c="'+s.id+'">'+(it.ok?'✓ 재확인 '+hm(it.ok)+' (취소하려면 터치)':s.cf)+'</button>';
else if(!s.ph.length)h+='<button class="chk'+(N&&N.c===s.id?' nx':'')+'" data-c="'+s.id+'">'+(dn?'✓ 완료 '+hm(it.ok)+' (취소하려면 터치)':'완료')+'</button>';
h+='</section>'});
$('#list').innerHTML=h;fillEx();
$('#bar i').style.width=(n/STEPS.length*100)+'%';
var all=n===STEPS.length;$('#share').disabled=!all;$('#share').style.display=all?'':'none';$('#next').style.display=all?'none':'';
if(N)$('#next').innerHTML=N.lab+'<small>'+N.sub+'</small>';
$('#msg').textContent=all?'모두 완료! 앱 공유로 보내주세요':'완료 '+n+' / '+STEPS.length;
}
$('#list').addEventListener('click',function(e){
var b=e.target.closest('button');if(!b)return;
if(b.dataset.z){var z=$('#zoom');z.querySelector('img').src=EX[b.dataset.z]||'';z.querySelector('p').textContent=b.dataset.zl+'  (눌러서 닫기)';z.style.display='flex';return}
if(b.dataset.c){var it=S.items[b.dataset.c]=S.items[b.dataset.c]||{};it.ok=it.ok?0:Date.now();save();render();if(it.ok)goNext();return}
cur={s:b.dataset.s,p:b.dataset.p};$('#cam').value='';$('#cam').click();
});
$('#zoom').addEventListener('click',function(){this.style.display='none'});
/* 촬영 사진: 긴 변 1000px · JPEG 0.6 축소 + 시각 각인. 가능한 폰은 축소해서 바로 디코딩(빠름) */
function stamp(src,w0,h0,c0){var M=1000,r=Math.min(1,M/Math.max(w0,h0)),w=Math.round(w0*r),h=Math.round(h0*r);
var cv=document.createElement('canvas');cv.width=w;cv.height=h;var x=cv.getContext('2d');x.drawImage(src,0,0,w,h);if(src.close)src.close();
var now=Date.now(),lab='가산 '+today().slice(5)+' '+hm(now),fs=Math.round(w/22);x.font='bold '+fs+'px sans-serif';
var tw=x.measureText(lab).width;x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,h-fs*1.7,tw+fs,fs*1.7);x.fillStyle='#ffde00';x.fillText(lab,fs/2,h-fs*.5);
cv.toBlob(function(bl){var k=c0.s+'_'+c0.p;if(urls[k]){URL.revokeObjectURL(urls[k]);delete urls[k]}
putP(k,bl);(S.items[c0.s]=S.items[c0.s]||{})[c0.p]=now;save();$('#busy').style.display='none';render();goNext()},'image/jpeg',0.6)}
function viaImg(f,c0){var u=URL.createObjectURL(f),im=new Image();
im.onload=function(){URL.revokeObjectURL(u);stamp(im,im.naturalWidth,im.naturalHeight,c0)};
im.onerror=function(){$('#busy').style.display='none';alert('사진을 불러오지 못했어요. 다시 찍어주세요.')};im.src=u}
$('#cam').addEventListener('change',function(){
var f=this.files&&this.files[0];if(!f||!cur)return;var c0=cur;$('#busy').style.display='flex';
if(window.createImageBitmap){createImageBitmap(f,{imageOrientation:'from-image'}).then(function(b){
var r=Math.min(1,1000/Math.max(b.width,b.height));if(r<1&&b.close){var w=Math.round(b.width*r),h=Math.round(b.height*r);b.close();
return createImageBitmap(f,{imageOrientation:'from-image',resizeWidth:w,resizeHeight:h,resizeQuality:'medium'}).then(function(b2){stamp(b2,b2.width,b2.height,c0)})}
stamp(b,b.width,b.height,c0)}).catch(function(){viaImg(f,c0)})}else viaImg(f,c0)});

function report(){var L=['🔒 [가산 마감 보고] '+today()+' '+'일월화수목금토'.charAt(new Date().getDay())+'요일',''];
STEPS.forEach(function(s,i){var it=S.items[s.id]||{},t=s.ph.length?s.ph.map(function(p){return hm(it[p[0]])}).join(', ')+(s.cf?' / 재확인 '+hm(it.ok):''):hm(it.ok);
L.push('✅ '+(i+1)+'. '+s.t.replace(/ 🔐/,'')+' — '+t)});
L.push('','사진 '+countP()+'장 첨부');return L.join('\n')}
function countP(){var n=0;STEPS.forEach(function(s){n+=s.ph.length});return n}
$('#share').addEventListener('click',function(){
var files=[],txt=report();
