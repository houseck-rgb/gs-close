<style>
:root{--g:#1f7a4d;--gl:#e8f5ee;--ink:#111;--sub:#666;--line:#e3e3e3;--red:#d33}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",Roboto,sans-serif}
body{padding:0 0 calc(110px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px}
header h1{font-size:21px;margin:0;flex:1}
header .d{font-size:14px;opacity:.9}
#bar{height:6px;background:#cfe8da}#bar i{display:block;height:100%;width:0;background:#ffc400;transition:width .3s}
main{padding:12px 14px;max-width:640px;margin:0 auto}
.card{border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card.done{border-color:var(--g);background:var(--gl)}
.card.hl{border:4px solid #0f5a35}
.card.hl .chk{border-width:3px;border-color:#0f5a35}
.hd{display:flex;align-items:flex-start;gap:10px}
.no{flex:none;width:30px;height:30px;border-radius:50%;background:#ddd;color:#333;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:16px}
.done .no{background:var(--g);color:#fff}
.tt{flex:1;font-size:19px;font-weight:800;line-height:1.35}
.tm{display:inline-block;background:#fff3c4;color:#8a5a00;font-size:14px;font-weight:800;border-radius:6px;padding:1px 7px;margin-right:4px;vertical-align:2px}
.ds{font-size:15px;color:var(--sub);margin:6px 0 0 40px;line-height:1.45}
.ds b{color:var(--red);font-size:18px;letter-spacing:1px}
.ph{display:grid;gap:8px;margin-top:12px}.ph.n1{grid-template-columns:1fr}.ph.n2{grid-template-columns:1fr 1fr}.ph.n3{grid-template-columns:1fr 1fr 1fr}.ph.n1 .slot{aspect-ratio:16/10}.ph.n3 .lb{font-size:13px;padding:7px 2px}.ph.n3 .ex{font-size:11px}
.slot{position:relative;border-radius:10px;overflow:hidden;background:#f2f2f2;aspect-ratio:3/4;border:0;padding:0;font:inherit;cursor:pointer}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot .lb{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;font-weight:700;padding:8px 4px;text-align:center}
.slot .ex{position:absolute;top:6px;left:6px;background:#fff;color:#333;font-size:12px;font-weight:800;border-radius:5px;padding:2px 6px}
.slot.ok .lb{background:var(--g)}
.slot.ok .ex{background:var(--g);color:#fff}
.chk{margin-top:12px;width:100%;min-height:54px;border:2px solid var(--g);background:#fff;color:var(--g);border-radius:12px;font-size:18px;font-weight:800;cursor:pointer}
.done .chk{background:var(--g);color:#fff}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:5}
.foot .in{max-width:640px;margin:0 auto;display:flex;gap:8px}
#share{flex:1;min-height:60px;border:0;border-radius:14px;background:#FEE500;color:#191919;font-size:19px;font-weight:900;cursor:pointer}
#share:disabled{background:#eee;color:#999}
#reset{flex:none;width:72px;line-height:1.3;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:14px;font-size:14px;color:#666}
#msg{text-align:center;font-size:14px;color:var(--sub);margin-bottom:6px}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:9;color:#fff;font-size:18px;font-weight:700}
input[type=file]{display:none}
#next{flex:1;min-height:64px;border:0;border-radius:14px;background:var(--g);color:#fff;font-size:20px;font-weight:900;cursor:pointer;line-height:1.2}
#next small{display:block;font-size:13px;font-weight:600;opacity:.85}
.slot.nx{outline:4px solid #ffc400;outline-offset:-4px}
.chk.nx{border-color:#ffc400;box-shadow:0 0 0 3px #ffc400}
</style>
</head>

var S={date:'',items:{}},photos={},urls={},db,cur=null;
var $=function(s){return document.querySelector(s)};
function today(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function p2(n){return(n<10?'0':'')+n}
function hm(t){var d=new Date(t);return p2(d.getHours())+':'+p2(d.getMinutes())}
function save(){try{localStorage.setItem('gasanClose',JSON.stringify(S))}catch(e){}}
/* IndexedDB: 찍은 사진(Blob) 보관 → 새로고침해도 유지 */
function idb(cb){try{var r=indexedDB.open('gasanClose',1);r.onupgradeneeded=function(){r.result.createObjectStore('p')};r.onsuccess=function(){db=r.result;cb()};r.onerror=function(){cb()}}catch(e){cb()}}
function tx(m){return db.transaction('p',m).objectStore('p')}
function putP(k,b){photos[k]=b;if(db)try{tx('readwrite').put(b,k)}catch(e){}}
function clearP(){photos={};for(var k in urls)URL.revokeObjectURL(urls[k]);urls={};if(db)try{tx('readwrite').clear()}catch(e){}}
function loadP(cb){if(!db)return cb();var st=tx('readonly'),r=st.openCursor();r.onsuccess=function(){var c=r.result;if(c){photos[c.key]=c.value;c.continue()}else cb()};r.onerror=function(){cb()}}

function nextStep(){for(var i=0;i<STEPS.length;i++){var s=STEPS[i],it=S.items[s.id]||{};

else if(!it.ok)return{c:s.id,lab:'✅ '+(i+1)+'. '+s.t+' 완료',sub:'완료했으면 누르기'}}return null}

STEPS.forEach(function(s,i){var it=S.items[s.id]||{},dn=stepDone(s);if(dn)n++;
h+='<section id="c_'+s.id+'" class="card'+(dn?' done':'')+(s.hl?' hl':'')+'"><div class="hd"><div class="no">'+(dn?'✓':i+1)+'</div><div class="tt">'+(s.tm?'<span class="tm">'+s.tm+'</span>':'')+s.t+'</div></div><div class="ds">'+s.d+'</div>';
if(s.ph.length){h+='<div class="ph n'+s.ph.length+'">';s.ph.forEach(function(p){var k=s.id+'_'+p[0],has=it[p[0]]&&photos[k];
if(has&&!urls[k])urls[k]=URL.createObjectURL(photos[k]);
h+='<button class="slot'+(has?' ok':'')+(N&&N.s===s.id&&N.p===p[0]?' nx':'')+'" data-s="'+s.id+'" data-p="'+p[0]+'"><img loading="lazy" decoding="async" src="'+(has?urls[k]:EX[p[0]])+'" alt=""><span class="ex">'+(has?'✓ '+hm(it[p[0]]):'예시')+'</span><span class="lb">'+(has?'다시 찍기':'📷 '+p[1])+'</span></button>'});h+='</div>'}
else h+='<button class="chk'+(N&&N.c===s.id?' nx':'')+'" data-c="'+s.id+'">'+(dn?'✓ 완료 '+hm(it.ok)+' (취소하려면 터치)':'완료')+'</button>';
h+='</section>'});
$('#list').innerHTML=h;
$('#bar i').style.width=(n/STEPS.length*100)+'%';
var all=n===STEPS.length;$('#share').disabled=!all;$('#share').style.display=all?'':'none';$('#next').style.display=all?'none':'';
if(N)$('#next').innerHTML=N.lab+'<small>'+N.sub+'</small>';
$('#msg').textContent=all?'모두 완료! 카톡으로 보내주세요':'완료 '+n+' / '+STEPS.length;
}
$('#list').addEventListener('click',function(e){
var b=e.target.closest('button');if(!b)return;
if(b.dataset.c){var it=S.items[b.dataset.c]=S.items[b.dataset.c]||{};it.ok=it.ok?0:Date.now();save();render();if(it.ok)goNext();return}
cur={s:b.dataset.s,p:b.dataset.p};$('#cam').value='';$('#cam').click();
});
/* 촬영 사진: 긴 변 1000px · JPEG 0.6으로 축소 + 시각 각인 → 빠른 전송 */
$('#cam').addEventListener('change',function(){
var f=this.files&&this.files[0];if(!f||!cur)return;var c0=cur;$('#busy').style.display='flex';
var u=URL.createObjectURL(f),im=new Image();
im.onload=function(){var M=1000,w=im.naturalWidth,h=im.naturalHeight,r=Math.min(1,M/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);
var cv=document.createElement('canvas');cv.width=w;cv.height=h;var x=cv.getContext('2d');x.drawImage(im,0,0,w,h);URL.revokeObjectURL(u);
var now=Date.now(),lab='가산 '+today().slice(5)+' '+hm(now),fs=Math.round(w/22);x.font='bold '+fs+'px sans-serif';
var tw=x.measureText(lab).width;x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,h-fs*1.7,tw+fs,fs*1.7);x.fillStyle='#ffde00';x.fillText(lab,fs/2,h-fs*.5);
cv.toBlob(function(bl){var k=c0.s+'_'+c0.p;if(urls[k]){URL.revokeObjectURL(urls[k]);delete urls[k]}
putP(k,bl);(S.items[c0.s]=S.items[c0.s]||{})[c0.p]=now;save();$('#busy').style.display='none';render();goNext()},'image/jpeg',0.6)};
im.onerror=function(){$('#busy').style.display='none';alert('사진을 불러오지 못했어요. 다시 찍어주세요.')};
im.src=u});

function report(){var L=['🔒 [가산 마감 보고] '+today()+' '+'일월화수목금토'.charAt(new Date().getDay())+'요일',''];
STEPS.forEach(function(s,i){var it=S.items[s.id]||{},t=s.ph.length?s.ph.map(function(p){return hm(it[p[0]])}).join(', '):hm(it.ok);
L.push('✅ '+(i+1)+'. '+s.t.replace(/ 🔐/,'')+' — '+t)});
L.push('','사진 '+countP()+'장 첨부');return L.join('\n')}
function countP(){var n=0;STEPS.forEach(function(s){n+=s.ph.length});return n}
$('#share').addEventListener('click',function(){
var files=[],txt=report();
STEPS.forEach(function(s,i){s.ph.forEach(function(p,j){var b=photos[s.id+'_'+p[0]];if(b)files.push(new File([b],'가산마감_'+(i+1)+'-'+(j+1)+'.jpg',{type:'image/jpeg'}))})});
if(navigator.canShare&&navigator.canShare({files:files})){
navigator.share({files:files,text:txt}).catch(function(e){if(e&&e.name!=='AbortError')fallback(txt)})}
else fallback(txt)});
function fallback(txt){
if(navigator.share){navigator.share({text:txt}).catch(function(){})}
else if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){alert('보고 내용이 복사됐어요. 카톡에 붙여넣고 사진은 따로 보내주세요.')})}
else alert(txt)}
/* 다음 할 일 버튼: 누르면 바로 카메라(또는 완료 체크) → 끝나면 다음 칸으로 자동 이동 */
function goNext(){var N=nextStep();var el=document.getElementById('c_'+(N?(N.s||N.c):'lock'));if(el)setTimeout(function(){el.scrollIntoView({behavior:'smooth',block:'center'})},60)}
$('#next').addEventListener('click',function(){var N=nextStep();if(!N)return;
if(N.c){(S.items[N.c]=S.items[N.c]||{}).ok=Date.now();save();render();goNext();return}
cur={s:N.s,p:N.p};$('#cam').value='';$('#cam').click()});
$('#reset').addEventListener('click',function(){if(confirm('오늘 기록과 사진을 모두 지우고 처음부터 할까요?')){S={date:today(),items:{}};clearP();save();render()}});

$('#today').textContent=today().slice(5).replace('-','/');
try{var o=JSON.parse(localStorage.getItem('gasanClose')||'null');if(o)S=o}catch(e){}
idb(function(){if(S.date!==today()){S={date:today(),items:{}};clearP();save();render()}else loadP(render)});
render();
if('serviceWorker'in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
</script>
</body>
</html>
